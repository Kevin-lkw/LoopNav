# Resolved model/sampling configuration used by the authors' current
# evaluate.sh at xizaoqu/WorldMem commit
# c1cc91bdfb2dda52fe309280e5ed046b1faba448.
#
# This file deliberately contains no local-training checkpoint settings.
debug: false
lr: 2.0e-5
x_shape: [3, 128, 128]
frame_stack: 1
frame_skip: 1
data_mean: 0.5
data_std: 0.5
external_cond_dim: 0
context_frames: 600
weight_decay: 2.0e-3
warmup_steps: 1000
optimizer_beta: [0.9, 0.99]
uncertainty_scale: 1
guidance_scale: 0.0
chunk_size: 1
scheduling_matrix: autoregressive
noise_level: random_all
causal: true
diffusion:
  objective: pred_v
  beta_schedule: sigmoid
  schedule_fn_kwargs: {}
  clip_noise: 20.0
  use_snr: false
  use_cum_snr: false
  use_fused_snr: true
  snr_clip: 5.0
  cum_snr_decay: 0.96
  timesteps: 1000
  sampling_timesteps: 20
  ddim_sampling_eta: 0.0
  stabilization_level: 15
  architecture:
    network_size: 64
    attn_heads: 4
    attn_dim_head: 64
    dim_mults: [1, 2, 4, 8]
    resolution: 128
    attn_resolutions: [16, 32, 64, 128]
    use_init_temporal_attn: true
    use_linear_attn: true
    time_emb_type: rotary
n_frames: 8
metadata: null
action_cond_dim: 25
pose_cond_dim: 5
use_plucker: true
focal_length: 0.35
relative_embedding: true
state_embed_only_on_qk: true
use_memory_attention: true
add_timestamp_embedding: true
ref_mode: sequential
memory_condition_length: 8
n_tokens: 8
log_video: false
save_local: false
lpips_batch_size: 16
require_pose_prediction: false
next_frame_length: 1
