run_name: nwm_cdit_b_32
# training setup
results_dir: logs
train: True
batch_size: 8
num_workers: 12
model: CDiT-B/2
lr: 8e-5

# normalization for the action space
normalize: True
grad_clip_val: 10.0
context_size: 32

# distance bounds for distance and action and distance predictions
distance:
  min_dist_cat: -64
  max_dist_cat: 64

# action output params
len_traj_pred: 64

# dataset specific parameters
image_size: 224
datasets:
